name: release

# Runs on a tag, with GitHub's own token: no release key belongs to one
# person. Actions are pinned to commits; Dependabot updates them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only unless a job says otherwise: a job that can mint an identity
# token is a job that could publish, so only those that must have one.
permissions:
  contents: read

jobs:
  # The verifiers' packages, built and checked before anything is released.
  # A tag whose packages carry another version, hold anything they should
  # not, or fail a vector once installed releases nothing at all.
  verifiers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # A prerelease tag (v0.3.0-rc.1) is checked like any other, and
      # publishes no package: the packages carry the plain version.
      - name: Build, install and verify every vector
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*-*) verifiers/pack.sh dist ;;
            refs/tags/v*) verifiers/pack.sh dist "${GITHUB_REF_NAME#v}" ;;
            *) verifiers/pack.sh dist ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi
          path: dist/pypi
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: dist/npm
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: verifiers
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The suite must pass before anything is built
        run: go test -count=1 ./...

      - name: Build
        run: |
          make build VERSION=${{ github.ref_name }}
          make build-all VERSION=${{ github.ref_name }}

      # The binary says what went into it; a dirty tree is source nobody can
      # fetch, and a require in go.mod is a dependency nobody declared.
      - name: Refuse to ship a modified build or a dependency
        run: |
          if go version -m bin/aertun | grep -q 'vcs.modified=true'; then
            echo "the working tree was dirty"; exit 1
          fi
          if go version -m bin/aertun | grep -q '^\s*dep\s'; then
            echo "the binary carries a third-party module"; exit 1
          fi

      - name: Checksums
        run: cd bin && sha256sum aertun aertun-* > SHA256SUMS

      - name: Attest the artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/aertun
            bin/aertun-*

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            bin/aertun-linux-amd64
            bin/aertun-linux-arm64
            bin/aertun-darwin-amd64
            bin/aertun-darwin-arm64
            bin/aertun-windows-amd64.exe
            bin/aertun-windows-arm64.exe
            bin/SHA256SUMS
            LICENSE
            NOTICE
          body: |
            Every artefact here carries its SHA-256 in `SHA256SUMS`, and each
            has a build provenance attestation:
            `gh attestation verify aertun-linux-amd64 --repo aertun/aertun`.

  image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Sign in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names are lowercase and the repository's name need not be
      # (it is aertun/Aertun), so the image's name is worked out once, here,
      # and every step below uses it rather than github.repository.
      - name: The image's name, in lowercase
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Image tags drop the v: the git tag v1.2.3 publishes 1.2.3, 1.2 and latest.
      - name: Names for this image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: The image must know its own version
        run: |
          tag='${{ steps.meta.outputs.version }}'
          got=$(docker run --rm "${{ steps.image.outputs.name }}:${tag}" --version | head -1)
          echo "the image reports: $got"
          case "$got" in
            *"$tag"*) echo "matches ${tag}" ;;
            *) echo "::error::the image reports \"$got\" and this release is ${tag}"; exit 1 ;;
          esac

      - name: The documented quickstart must reach the console
        run: |
          img="${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
          docker run --rm -v qs:/srv "$img" --root /srv/store init --owner ci@example.com
          docker run -d --name qs -p 8080:8080 -v qs:/srv "$img"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/signin || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::the documented quickstart does not serve the sign-in page (HTTP ${code:-none})"
            docker logs qs 2>&1 | tail -20
            exit 1
          fi
          echo "the console serves its sign-in page"

  # The packages the verifiers job built and checked, published from this
  # workflow by trusted publishing: no token is stored anywhere, and each
  # registry checks that the upload came from this file, in this
  # repository, in its environment. Only a release tag publishes.
  pypi:
    runs-on: ubuntu-latest
    needs: [verifiers, release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi
          path: dist
      # Uploads with an attestation of this workflow run (PEP 740).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # Staged, not published: npm makes it public only once a maintainer
  # approves it with two-factor authentication, so this workflow alone
  # cannot put a version in front of users. Provenance comes with trusted
  # publishing.
  npm:
    runs-on: ubuntu-latest
    needs: [verifiers, release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist
      - name: Stage the package
        run: |
          # Staging by trusted publishing needs npm 11.15.0 or later.
          if ! printf '11.15.0\n%s\n' "$(npm --version)" | sort -V -C; then
            echo "::error::npm $(npm --version) cannot stage by trusted publishing"; exit 1
          fi
          npm stage publish "dist/aertun-verify-${GITHUB_REF_NAME#v}.tgz"
